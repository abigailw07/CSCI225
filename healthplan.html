<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Health Plan - BMI and Calorie Calculator</title>
</head>
<body>
    <div class="container">
        <h2>BMI and Calorie Calculator</h2>

        <div class="form-group">
            <label for="weight">Weight (kg):</label>
            <input type="number" id="weight" placeholder="e.g., 70" min="1" step="any">
        </div>
        <div class="form-group">
            <label for="height">Height (cm):</label>
            <input type="number" id="height" placeholder="e.g., 175" min="1" step="any">
        </div>
        <div class="form-group">
            <label for="age">Age:</label>
            <input type="number" id="age" placeholder="e.g., 30" min="1">
        </div>

        <div class="form-group">
            <label for="gender">Gender:</label>
            <select id="gender">
                <option value="male">Male</option>
                <option value="female">Female</option>
            </select>
        </div>

        <button id="calc-btn">Generate Meal PLan</button>

        <div id="results-box" class="results" style="display:none;">
            <h3>Your Report</h3>
            <p><strong>BMI:</strong> <span id="bmi-output">0.00</span></p>
            <p><strong>Calorie Target:</strong> <span id="calorie-output">0</span></p>

            <h4>Suggested Meal Plan</h4>
            <ul id="meal-list"></ul>
            <p><strong>Total Meal Plan Calories:</strong> <span id="total-meal-calories">0</span> calories</p>
        </div>

        <div class="visual-container">
            <img id="person-img" src="img/person.png" style="width: 100px; height: 200px; transition: width 0.5s ease, height 0.5s ease;">
        </div>
    </div>
    
    <script>
        // Example foodDatabase provided from your file
        const foodDatabase = [
            { name: "Apple (1 medium)", cal: 95 },
            { name: "Banana (1 medium)", cal: 105 },
            { name: "Orange (1 medium)", cal: 62 },
            { name: "Grapes (1 cup)", cal: 104 },
            { name: "Strawberries (1 cup)", cal: 49 },
            { name: "Broccoli (1 cup)", cal: 55 },
            { name: "Carrots (1 cup)", cal: 52 },
            { name: "Spinach (1 cup)", cal: 7 },
            { name: "Potato (1 medium)", cal: 161 },
            { name: "Sweet Potato (1 medium)", cal: 103 },
            { name: "Avocado (half)", cal: 117 },
            { name: "Chicken Breast (4oz)", cal: 165 },
            { name: "Salmon (4oz)", cal: 235 },
            { name: "Ground Beef 80/20 (4oz)", cal: 287 },
            { name: "Egg (1 large)", cal: 72 },
            { name: "Tofu (1/2 cup)", cal: 94 },
            { name: "Black Beans (1/2 cup)", cal: 114 },
            { name: "Lentils (1/2 cup)", cal: 115 },
            { name: "Plain Greek Yogurt (1 cup)", cal: 100 },
            { name: "Almonds (1 oz)", cal: 164 },
            { name: "Peanuts (1 oz)", cal: 161 },
            { name: "Peanut Butter (2 tbsp)", cal: 188 },
            { name: "Brown Rice (1 cup cooked)", cal: 216 },
            { name: "White Rice (1 cup cooked)", cal: 205 },
            { name: "Quinoa (1 cup cooked)", cal: 222 },
            { name: "Oats (1/2 cup dry)", cal: 150 },
            { name: "Whole Wheat Bread (1 slice)", cal: 69 },
            { name: "White Bread (1 slice)", cal: 75 },
            { name: "Pasta (1 cup cooked)", cal: 220 },
            { name: "Bagel (1 medium)", cal: 245 },
            { name: "Flour Tortilla (8 inch)", cal: 144 },
            { name: "Vanilla Ice Cream (1/2 cup)", cal: 137 },
            { name: "Chocolate Chip Cookie (1 medium)", cal: 148 },
            { name: "Potato Chips (1 oz)", cal: 152 },
            { name: "Pretzels (1 oz)", cal: 108 },
            { name: "Cheddar Cheese (1 oz)", cal: 113 },
            { name: "Butter (1 tbsp)", cal: 102 },
            { name: "Olive Oil (1 tbsp)", cal: 119 },
            { name: "Whole Milk (1 cup)", cal: 149 },
            { name: "Almond Milk (1 cup)", cal: 39 },
            { name: "Orange Juice (1 cup)", cal: 112 },
            { name: "Cola (12 oz)", cal: 140 },
            { name: "Black Coffee (8 oz)", cal: 2 },
            { name: "Bacon (2 slices)", cal: 86 },
            { name: "Pork Sausage (1 link)", cal: 133 },
            { name: "Pancakes (2 medium)", cal: 172 },
            { name: "Waffle (1 large)", cal: 218 },
            { name: "Honey (1 tbsp)", cal: 64 },
            { name: "Maple Syrup (1 tbsp)", cal: 52 },
            { name: "Cheese Pizza (1 slice)", cal: 285 }
        ];

        // Metric formulas
        function calculateMetrics(weight, height, age, gender) {
            const heightM = height / 100;
            const bmi = (weight / (heightM * heightM)).toFixed(2);

            let bmr;
            if (gender === 'male') {
                bmr = (10 * weight) + (6.25 * height) - (5 * age) + 5;
            } else {
                bmr = (10 * weight) + (6.25 * height) - (5 * age) - 161;
            }

            // Calorie target
            const calorieTarget = Math.round(bmr * 1.2);

            return { bmi, calorieTarget };
            }

            // Randomized meal plan
            function selectMealPlan(calorieTarget, database) {
            // Create a copy and shuffle the array
            const shuffledFoods = [...database].sort(() => 0.5 - Math.random());
            
            let selectedFoods = [];
            let currentTotalCalories = 0;

            for (let food of shuffledFoods) {
                if (currentTotalCalories + food.cal <= calorieTarget) {
                selectedFoods.push(food);
                currentTotalCalories += food.cal;
                }
            }

            return { selectedFoods, currentTotalCalories };
            }

            // Animation
            function animatePerson(bmi) {
                const personImg = document.getElementById('person-img');
                if (!personImg) return;

                const baseWidth = 100;
                const baseHeight = 200;

                let widthScale = bmi / 22;
                let heightScale = 22 / bmi;

                widthScale = Math.max(0.5, Math.min(widthScale, 2.0));
                heightScale = Math.max(0.75, Math.min(heightScale, 1.1));

                const targetWidth =  Math.round(baseWidth * widthScale);
                const targetHeight = Math.round(baseHeight * heightScale);

                personImg.style.width = `${targetWidth}px`;
                personImg.style.height = `${targetHeight}px`;
            }

            // Visual layout 
            function updateVisualIndicator(bmi) {
            const personImg = document.getElementById('person-img');
            if (!personImg) return;

            // Scale the box element depending on the BMI
            if (bmi < 18.5) {
                personImg.style.width = '70px';
                personImg.style.height = '200px';
            } else if (bmi >= 18.5 && bmi < 25) {
                personImg.style.width = '100px';
                personImg.style.height = '200px';
            } else if (bmi >= 25 && bmi < 30) {
                personImg.style.width = '130px';
                personImg.style.height = '200px';
            } else {
                personImg.style.width = '160px';
                personImg.style.height = '200px';
            }
            }

            // Click event listener to the Generate Meal Plan button
            document.getElementById('calc-btn').addEventListener('click', () => {
            const weight = parseFloat(document.getElementById('weight').value);
            const height = parseFloat(document.getElementById('height').value);
            const age = parseInt(document.getElementById('age').value);
            const gender = document.getElementById('gender').value;

            if (!weight || !height || !age) {
                alert('Please complete all form inputs.');
                return;
            }

            // Run calculation formulas
            const { bmi, calorieTarget } = calculateMetrics(weight, height, age, gender);
            const { selectedFoods, currentTotalCalories } = selectMealPlan(calorieTarget, foodDatabase);

            // Update DOM strings
            document.getElementById('bmi-output').textContent = bmi;
            document.getElementById('calorie-output').textContent = calorieTarget;
            document.getElementById('total-meal-calories').textContent = currentTotalCalories;

            // Adapt the physical visual container style
            updateVisualIndicator(parseFloat(bmi));

            // Clear previous list item nodes and populate new ones
            const mealListEl = document.getElementById('meal-list');
            mealListEl.innerHTML = '';
            
            selectedFoods.forEach(food => {
                const li = document.createElement('li');
                li.textContent = `${food.name} (${food.cal} cal)`;
                mealListEl.appendChild(li);
            });

            // Display report layout block
            document.getElementById('results-box').style.display = 'block';
        });

    </script>
</body>
</html>
