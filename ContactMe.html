<!DOCTYPE html>
<html lang = "en">
<head>
    <meta charset="UTF-8">
    <title>Contact Me - Feedback</title>
</head>
<body>

    <h1>Welcome to My Page</h1>

    <!-- Embedded Video-->
     <div>
        <video width="480" controls>
            <source src="myvideo.mp4" type="video/mp4">
            Your browser does not support the video tag
        </video>
     </div>

     <hr>

     <!-- Feedback Form-->
      <form name="feedback" action="#" method="post">
        <!-- First Name -->
        <label for="fname">First Name:</label>
        <input type="text" id="fname" name="fname" placeholder="anonymous" required><br><br>

        <!-- Last Name -->
        <label for="lname">Last Name:</label>
        <input type="text" id="lname" name="lname" placeholder="anonymous" required><br><br>

        <!-- Email -->
        <label for="mail">Email Address:</label>
        <input type="email" id="mail" name="mail" placeholder="name@usca.edu" required><br><br>

        <!-- Recomendation Radio Buttons-->
        <label>Would you recommend this website?</label><br>
        <input type="radio" id="rec_yes" name="recommend" value="yes">
        <label for="rec_yes">Yes</label>
        <input type="radio" id="rec_no" name="recommend" value="no">
        <label for="rec_no">No</label><br><br>

        <!-- Favorite Website Selection Box-->
        <label for="favsite">Favorite Website:</label>
        <select id="favsite" name="favsite">
            <option value="Google">Google</option>
            <option value="Facebook">Facebook</option>
            <option value="Twitter">Twitter</option>
            <option value="Time">Time</option>
        </select><br><br>
        
        <!-- Rating Range Element-->
        <lable for="rating">Rate this website (1 to 10):</lable>
        <input type="range" id="rating" name="rating" min="1" max="10"><br><br>

        <!-- Additional Comments -->
         

      </form>
</body>
</html>
